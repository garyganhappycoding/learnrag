<!DOCTYPE html>
<html>
<head>
    <title>Ask About Gary</title>
    <style>
        .message { margin: 10px 0; padding: 8px 12px; border-radius: 8px; max-width: 500px; }
        .user-message { background: #e0e0e0; text-align: right; margin-left: auto; }
        .bot-message { background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>Ask a question</h1>
    <input type="text" id="questionInput" placeholder="Type your question here" style="width: 400px;">
    <button onclick="askQuestion()">Ask</button>
    <div id="chatContainer" style="margin-top: 20px;"></div>

    <script>
        let conversationHistory = [];

        function addMessageToChat(text, sender) {
            const chatContainer = document.getElementById("chatContainer");
            const messageDiv = document.createElement("div");
            messageDiv.className = sender === "user" ? "message user-message" : "message bot-message";
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
        }

        async function askQuestion() {
            const questionInput = document.getElementById("questionInput");
            const question = questionInput.value;
            if (!question) return;

            addMessageToChat(question, "user");
            questionInput.value = "";

            const thinkingDiv = document.createElement("div");
            thinkingDiv.className = "message bot-message";
            thinkingDiv.innerText = "Thinking...";
            thinkingDiv.id = "thinkingIndicator";
            document.getElementById("chatContainer").appendChild(thinkingDiv);

            const response = await fetch("https://learnrag.onrender.com/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    question: question,
                    history: conversationHistory
                })
            });

            document.getElementById("thinkingIndicator").remove();

            if (response.status === 429) {
                addMessageToChat("You're asking too quickly — please wait a minute and try again.", "bot");
                return;
            }

            const data = await response.json();
            addMessageToChat(data.answer, "bot");

            conversationHistory.push({ role: "user", content: question });
            conversationHistory.push({ role: "assistant", content: data.answer });
        }
    </script>
</body>
</html>
